<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <style>
    .bg { fill: #0d1117; rx: 8px; }
    .axis-bg { stroke: #23282e; stroke-width: 2; }
    .axis-active { stroke: #3fb950; stroke-width: 3; stroke-linecap: round; }
    .poly-fill { fill: rgba(46, 160, 67, 0.25); stroke: #3fb950; stroke-width: 2; }
    .node-dot { fill: #ffffff; stroke: #3fb950; stroke-width: 2.5; }
    .label-title { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; text-anchor: middle; }
    .label-pct { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
  </style>

  <rect width="100%" height="100%" class="bg" />

  <!-- Main Background Axis Grid Lines -->
  <!-- Vertical Axis Line (Code review <-> Pull requests) -->
  <line x1="200" y1="50" x2="200" y2="270" class="axis-bg" />
  <!-- Horizontal Axis Line (Commits <-> Issues) -->
  <line x1="90" y1="160" x2="310" y2="160" class="axis-bg" />

  <!-- Polygon Area representing active metrics -->
  <polygon points="200,144 216,160 200,184.2 130.7,160" class="poly-fill" />

  <!-- Active Highlight Lines along each axis -->
  <line x1="200" y1="160" x2="200" y2="144" class="axis-active" />
  <line x1="200" y1="160" x2="216" y2="160" class="axis-active" />
  <line x1="200" y1="160" x2="200" y2="184.2" class="axis-active" />
  <line x1="200" y1="160" x2="130.7" y2="160" class="axis-active" />

  <!-- Node Dots at active positions -->
  <circle cx="200" cy="144" r="4.5" class="node-dot" />
  <circle cx="216" cy="160" r="4.5" class="node-dot" />
  <circle cx="200" cy="184.2" r="4.5" class="node-dot" />
  <circle cx="130.7" cy="160" r="4.5" class="node-dot" />

  <!-- TOP LABELS: Code review -->
  <text x="200" y="30" class="label-title">Code review</text>
  <text x="200" y="45" class="label-pct">7%</text>

  <!-- BOTTOM LABELS: Pull requests -->
  <text x="200" y="288" class="label-pct">22%</text>
  <text x="200" y="304" class="label-title">Pull requests</text>

  <!-- LEFT LABELS: Commits -->
  <text x="45" y="154" class="label-pct">63%</text>
  <text x="45" y="172" class="label-title">Commits</text>

  <!-- RIGHT LABELS: Issues -->
  <text x="355" y="154" class="label-pct">7%</text>
  <text x="355" y="172" class="label-title">Issues</text>
</svg>
