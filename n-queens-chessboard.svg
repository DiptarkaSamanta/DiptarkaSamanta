      <text x="18" y="28" font-family="sans-serif" font-size="14" fill="#94a3b8">Constraint: <tspan fill="#f59e0b" font-weight="bold">Zero Attacking Lines</tspan></text>
    </g>
    
    <g transform="translate(0, 210)">
